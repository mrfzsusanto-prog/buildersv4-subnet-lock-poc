[profile.default]
src = "src"
test = "test"
out = "out"
solc = "0.8.20"
optimizer = true
optimizer_runs = 200
evm_version = "paris"
remappings = [
  "@openzeppelin/contracts-upgradeable/=src/@openzeppelin/contracts-upgradeable/",
  "@openzeppelin/contracts/=src/@openzeppelin/contracts/",
  "@solarity/solidity-lib/=src/@solarity/solidity-lib/"
]
